[project]
name = "ponto-do-cafe"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "duckdb>=1.5.5",
    "fastexcel>=0.21.0",
    "geopandas>=1.1.4",
    "openpyxl>=3.1.5",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pypdf>=6.19.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
